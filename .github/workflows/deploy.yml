name: Deploy shortlink-api
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of a published master commit
        required: true
        type: string
permissions:
  actions: read
concurrency:
  group: shortlink-api-vps
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ inputs.sha }}
    steps:
      - name: Check successful CI for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full Git commit SHA" >&2
            exit 2
          fi
          
          runs_url="repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?branch=master&event=push&head_sha=$DEPLOY_SHA&status=success&per_page=1"
          successful_runs=$(gh api "$runs_url" --jq '.total_count')
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "No successful Tests run on master for $DEPLOY_SHA" >&2
            exit 1
          fi
      - name: Deploy over SSH
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          key_file="$RUNNER_TEMP/shortlink-actions"
          hosts_file="$RUNNER_TEMP/shortlink-known-hosts"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hosts_file"
          ssh -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" \
            -i "$key_file" \
            root@94.183.178.95 "$DEPLOY_SHA"
          
