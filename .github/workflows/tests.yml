name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shortlink_app_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/shortlink_app_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/shortlink_app_test"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Check models match migrations
        run: alembic check
      - name: Run tests
        run: pytest -q
  docker:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    env:
      IMAGE: "ghcr.io/razi277227-droid/shortlink-api:${{ github.sha }}"
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t "$IMAGE" .
      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
