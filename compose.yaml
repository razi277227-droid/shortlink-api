services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shortlink_app_dev
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shortlink", "-d", "shortlink_app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  api:
    build: .
    image: banana:latest
    environment:
      DATABASE_URL: "postgresql+psycopg://shortlink:${POSTGRES_PASSWORD}@db:5432/shortlink_app_dev"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - > 
        alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000
    


volumes:
  postgres_data:


